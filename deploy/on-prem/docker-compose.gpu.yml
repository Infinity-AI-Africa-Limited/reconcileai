# ─────────────────────────────────────────────────────────────────────────────
# ReconcileAI — private Qwen GPU serving profile (NVIDIA GPU REQUIRED)
#
#   app  ──authenticated http──►  vllm (serves an approved Qwen artifact)
#   app  ──sql───►  db (MySQL)
#
# Requires the NVIDIA Container Toolkit on an institution-controlled GPU host.
# This is NOT for developer laptops: use docker-compose.cpu.yml + Ollama there.
# vLLM has no published host port; traffic is restricted to the private Compose
# network and the application must authenticate to it with VLLM_API_KEY.
#
# Run:
#   cp .env.onprem.example .env.onprem   # then edit secrets
#   docker compose -f docker-compose.gpu.yml --env-file .env.onprem up -d --build
# ─────────────────────────────────────────────────────────────────────────────
name: reconcileai-onprem-gpu

services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: reconcileai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-change-me}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_ROOT_PASSWORD:-change-me}"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [bank-internal]

  vllm:
    image: ${VLLM_IMAGE:-vllm/vllm-openai:latest}
    restart: unless-stopped
    # In a bank environment, use an image digest and pre-stage the approved model
    # artifact in hf-cache. Do not rely on an internet model download at the client.
    command: >
      --model ${RECON_MODEL:?Set RECON_MODEL to an approved Qwen artifact}
      --served-model-name reconcileai
      --revision ${MODEL_REVISION:?Set MODEL_REVISION to the approved immutable model revision}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-8192}
      --gpu-memory-utilization ${VLLM_GPU_MEMORY_UTILIZATION:-0.85}
      --api-key ${VLLM_API_KEY:?Set VLLM_API_KEY to a deployment-specific secret}
      --disable-log-requests
    environment:
      HF_HOME: /root/.cache/huggingface
    volumes:
      - hf-cache:/root/.cache/huggingface
    networks: [bank-internal]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 180s

  app:
    build:
      context: ../..
      dockerfile: deploy/on-prem/Dockerfile
    depends_on:
      db:
        condition: service_healthy
      vllm:
        condition: service_healthy
    env_file: .env.onprem
    environment:
      DEPLOYMENT_MODE: on_premise
      EGRESS_ALLOWLIST: vllm                # in-stack model host
      DATABASE_URL: mysql://root:${MYSQL_ROOT_PASSWORD:-change-me}@db:3306/reconcileai
      DIRECT_LLM_API_KEY: ${VLLM_API_KEY:?Set VLLM_API_KEY to a deployment-specific secret}
      DIRECT_LLM_API_URL: http://vllm:8000/v1
      DIRECT_LLM_PROVIDER: openai
      DIRECT_LLM_MODEL: reconcileai          # matches --served-model-name above
      PORT: 3000
      NODE_ENV: production
    ports:
      - "${APP_BIND_ADDRESS:-127.0.0.1}:3000:3000"
    networks: [bank-internal]
    restart: unless-stopped

volumes:
  db-data:
  hf-cache:

networks:
  # No service in this profile can initiate external network traffic. The host's
  # bank-approved reverse proxy terminates TLS and reaches the app on loopback.
  bank-internal:
    internal: true
