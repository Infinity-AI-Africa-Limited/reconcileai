name: Woodcore mirror sync

# Refreshes the wc_* mirror tables in TiDB from the live Woodcore tenant by
# triggering the app's POST /api/woodcore/sync endpoint. The sync runs on the
# Railway server (this job just kicks it off and returns).
#
# Setup:
#   1. In Railway, set CRON_SECRET to a strong random value.
#   2. In GitHub → Settings → Secrets and variables → Actions, add a secret
#      WOODCORE_SYNC_SECRET with the SAME value.
#   3. After DNS cutover, update SYNC_URL below to https://reconcileaiafrica.com/...

on:
  schedule:
    - cron: "0 2 * * *" # daily at 02:00 UTC
  workflow_dispatch: {} # allow manual runs from the Actions tab

jobs:
  trigger-sync:
    runs-on: ubuntu-latest
    env:
      # Use www directly — the bare domain goes through GoDaddy forwarding which
      # strips the POST method on redirect (301 → GET), causing a 405 on the API.
      SYNC_URL: "https://www.reconcileaiafrica.com/api/woodcore/sync"
    steps:
      - name: Trigger mirror sync
        env:
          # Prefer a single CRON_SECRET mirroring Railway's variable name, so a
          # rotation updates ONE GitHub secret instead of one per workflow. Two
          # secrets holding the same value IS the drift surface — it is exactly
          # what broke this job on 2026-08-02. Falls back to the legacy
          # per-workflow secret so nothing breaks before CRON_SECRET is created.
          SYNC_SECRET: ${{ secrets.CRON_SECRET || secrets.WOODCORE_SYNC_SECRET }}
        run: |
          # Skip cleanly when the secret isn't configured on this repo (e.g. the
          # MistaRichMan mirror). This prevents spurious "all jobs failed" emails;
          # the sync only runs where WOODCORE_SYNC_SECRET is set to match the
          # server's CRON_SECRET (or JWT_SECRET fallback).
          if [ -z "$SYNC_SECRET" ]; then
            echo "WOODCORE_SYNC_SECRET is not configured on this repository — skipping sync (expected on the mirror)."
            exit 0
          fi
          code=$(curl -sS -o /tmp/resp -w "%{http_code}" -X POST \
            -H "x-sync-secret: $SYNC_SECRET" \
            "$SYNC_URL")
          echo "HTTP $code"; cat /tmp/resp; echo
          # 202 = started, 409 = a sync is already running — both are fine.
          if [ "$code" = "202" ] || [ "$code" = "409" ]; then
            exit 0
          fi
          echo
          if [ "$code" = "403" ]; then
            echo "::error::403 forbidden — WOODCORE_SYNC_SECRET no longer matches the server's CRON_SECRET."
            echo "This is the expected symptom after a secret rotation: CRON_SECRET (or JWT_SECRET,"
            echo "which it falls back to) was changed on Railway without updating this repository secret."
            echo "It happened on 2026-08-02 and the mirror went stale for three days before anyone noticed."
            echo
            echo "Fix: copy the CURRENT CRON_SECRET from Railway into"
            echo "  GitHub → Settings → Secrets and variables → Actions → WOODCORE_SYNC_SECRET"
            echo "then re-run this workflow. The server logs the same diagnosis under [syncAuth]."
            echo "Rotation runbook: CLAUDE.md §18 — it lists every consumer that must be updated together."
          else
            echo "::error::Unexpected status $code from $SYNC_URL"
          fi
          exit 1
